<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<title>YTuner</title>
<style>
@font-face {
  font-family: 'Albertus';
  src: url('Albertus Medium Regular.ttf');
}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ytunerlogo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a1628;--surface:#111d35;--surface2:#16243d;
  --border:#1e2e4a;--border2:#253551;
  --accent:#3b82f6;--amber:#f59e0b;
  --text:#e2e8f0;--text2:#7d93b2;--text3:#3d5278;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

/* TEMA: Kömür — saf siyah, sarı vurgu */
.theme-page.theme-komur{
  --bg:#0a0a0a;--surface:#161616;--surface2:#1f1f1f;
  --border:#2a2a2a;--border2:#3a3a3a;
  --accent:#facc15;--amber:#fb923c;
  --text:#f5f5f5;--text2:#a3a3a3;--text3:#525252;
}

/* TEMA: Krem — açık kağıt, kahverengi/yeşil */
.theme-page.theme-krem{
  --bg:#f5e9d3;--surface:#ebdcc1;--surface2:#e0cda8;
  --border:#c8b48f;--border2:#a8927a;
  --accent:#15803d;--amber:#a04b2a;
  --text:#3a2a1a;--text2:#7a6a55;--text3:#9c8a72;
}

/* TEMA: Mor Neon — koyu mor, neon pembe */
.theme-page.theme-morNeon{
  --bg:#1a0c2e;--surface:#241338;--surface2:#2e1a47;
  --border:#3a1c5a;--border2:#4a2c6a;
  --accent:#f0abfc;--amber:#c026d3;
  --text:#f3e8ff;--text2:#c084fc;--text3:#7e22ce;
}

/* TEMA: Orman — koyu yeşil, altın */
.theme-page.theme-orman{
  --bg:#0d1f15;--surface:#152b1f;--surface2:#1e3a2a;
  --border:#234a35;--border2:#2a5a40;
  --accent:#fbbf24;--amber:#f97316;
  --text:#dcfce7;--text2:#86efac;--text3:#4ade80;
}

html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100dvh;display:flex;flex-direction:column;
  overflow:hidden;
  padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
  user-select:none;
}
#carouselContainer {
  flex: 1;
  overflow: hidden;
  position: relative;
  width: 100%;
}
#themeCarousel {
  display: flex;
  height: 100%;
  width: 300%;
  transform: translateX(-33.333%);
  will-change: transform;
}
.theme-page {
  width: 100vw;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  transition: background 0.4s ease;
}

.app-header{
  padding: 16px 20px 4px;
  display: flex;
  justify-content: flex-start;
  align-items: center;
  flex-shrink: 0;
}
.logo{
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 1px;
  font-family: 'Albertus', serif;
  text-transform: uppercase;
}
.logo-highlight { 
  color: #3b82f6; /* Elektrik Mavisi */
}
.logo-tuner {
  color: #fff8e7; /* Evren Rengi (Cosmic Latte) */
}
#installBtn {
  margin-left: auto;
  padding: 8px 16px;
  background: #3b82f6;
  color: #fff;
  border: none;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.5px;
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
  transition: all 0.2s;
  font-family: 'Inter', sans-serif;
  text-transform: uppercase;
}
#installBtn:active { transform: scale(0.95); }
#installBtn svg { width: 14px; height: 14px; }

/* MODE TOGGLE */
.mode-toggle{
  display:flex;align-items:center;gap:0;
  margin:12px 16px 0;
  background:var(--surface2);border-radius:12px;padding:3px;
  border:1px solid var(--border2);flex-shrink:0;
}
.mode-tab{
  flex:1;padding:7px 0;border-radius:9px;
  font-size:10px;font-weight:700;letter-spacing:.8px;
  color:var(--text3);cursor:pointer;text-align:center;
  transition:all .2s;border:none;background:transparent;
  font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;
}
.mode-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* NOTE CARD */
.note-card{
  margin:12px 16px 0;border-radius:18px;
  border:1px solid var(--border2);background:var(--surface);
  padding:18px 22px;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;min-height:110px;transition:all 0.4s ease;
}
.note-card.in-tune{border-color:rgba(74,222,128,.35);box-shadow:0 0 24px rgba(74,222,128,.08)}
.note-display{display:flex;align-items:flex-end;gap:6px}
.note-letter{font-size:64px;font-weight:600;line-height:1;color:var(--text);letter-spacing:-1px;transition:color .3s;font-family:'Inter',sans-serif;}
.note-card.in-tune .note-letter{color:#4ade80}
.note-octave{font-size:22px;font-weight:400;color:var(--text3);padding-bottom:8px;transition:color .3s;font-family:'Inter',sans-serif;}
.note-card.in-tune .note-octave{color:rgba(74,222,128,.6)}
.note-info{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.note-freq{font-family:'Inter',sans-serif;font-size:12px;color:var(--text2);letter-spacing:.5px}
.target-note{font-family:'Inter',sans-serif;font-size:11px;color:var(--text3)}
.target-note span{color:var(--accent);font-weight:600}
.manual-badge{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--amber);padding:2px 8px;border-radius:10px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);display:none}
.manual-badge.show{display:block}
.in-tune-badge{padding:4px 10px;border-radius:20px;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);font-size:9px;font-weight:800;letter-spacing:2px;color:#4ade80;opacity:0;transition:opacity .3s}
.note-card.in-tune .in-tune-badge{opacity:1}

/* MİKROTONAL KART */
.micro-card{
  margin:12px 16px 0;border-radius:18px;
  border:1px solid var(--border2);background:var(--surface);
  padding:18px 22px;display:none;align-items:center;justify-content:space-between;
  flex-shrink:0;min-height:110px;transition:all 0.4s ease;
}
.micro-card.show{display:flex}
.micro-card.in-tune{border-color:rgba(59,130,246,.35);box-shadow:0 0 24px rgba(59,130,246,.08)}
.micro-left{display:flex;flex-direction:column;gap:4px}
.micro-note{font-size:60px;font-weight:800;line-height:1;color:var(--text);letter-spacing:-2px;transition:color .3s}
.micro-card.in-tune .micro-note{color:var(--accent)}
.micro-perde{font-size:14px;font-weight:600;color:var(--text3);letter-spacing:.3px}
.micro-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.micro-koma{font-family:'Inter',sans-serif;font-size:26px;font-weight:700;color:var(--text2)}
.micro-koma sub{font-size:11px;font-weight:400;color:var(--text3);margin-left:2px}
.micro-freq{font-family:'Inter',sans-serif;font-size:12px;color:var(--text3)}
.micro-dev{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--text2)}
.micro-intune{padding:4px 10px;border-radius:20px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);font-size:9px;font-weight:800;letter-spacing:2px;color:var(--accent);opacity:0;transition:opacity .3s}
.micro-card.in-tune .micro-intune{opacity:1}

/* GAUGE */
.gauge-section{flex:1;display:flex;flex-direction:row;align-items:center;justify-content:center;min-height:0;position:relative;gap:4px;padding:0 8px}
.gauge-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;min-height:0;position:relative;overflow:hidden;touch-action:pan-y}
#gaugeCanvas{width:100%;max-width:380px;display:block;transition:transform .25s cubic-bezier(.32,.72,0,1), opacity .2s}
.gauge-arrow{width:36px;height:36px;border-radius:50%;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;font-family:'Inter',sans-serif;flex-shrink:0;padding-bottom:2px}
.gauge-arrow:hover{border-color:var(--accent);color:var(--text)}
.gauge-arrow:active{transform:scale(.92);background:var(--border2)}
.gauge-dots{display:flex;justify-content:center;gap:6px;padding:6px 0 0;flex-shrink:0}
.gauge-dot{width:6px;height:6px;border-radius:50%;background:var(--border2);transition:all .2s;cursor:pointer;border:none;padding:0;-webkit-tap-highlight-color:transparent}
.gauge-dot.active{background:var(--accent);width:18px;border-radius:3px}
.gauge-name{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:600;letter-spacing:2px;color:var(--text3);text-transform:uppercase;pointer-events:none}
@media (max-width:480px){
  .gauge-arrow{display:none}
  .gauge-section{padding:0}
}

/* CENTS */
.cent-row{display:flex;align-items:center;justify-content:space-between;padding:2px 24px 0;flex-shrink:0;width:100%;max-width:380px;align-self:center}
.cent-side{color:var(--text3);font-size:10px;font-weight:600;letter-spacing:1px}
.cent-val{font-family:'Inter',sans-serif;font-size:16px;font-weight:500;color:var(--text2);transition:color .3s;min-width:60px;text-align:center}
.cent-val.in-tune{color:#4ade80}

/* STRINGS */
.strings-wrap{padding:8px 20px;flex-shrink:0}
.strings-list{display:flex;align-items:flex-end;justify-content:center}
.string-item{display:flex;flex-direction:column;align-items:center;flex:1;max-width:60px;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0 2px}
.string-line{height:2px;width:100%;background:var(--border2);border-radius:1px;transition:background .2s;margin-bottom:10px}
.string-item:nth-child(1) .string-line{height:4px}
.string-item:nth-child(2) .string-line{height:3.5px}
.string-item:nth-child(3) .string-line{height:3px}
.string-item:nth-child(4) .string-line{height:2.5px}
.string-item:nth-child(5) .string-line{height:2px}
.string-item:nth-child(6) .string-line{height:1.5px}
.string-item.active .string-line{background:var(--accent)}
.string-item.active.in-tune .string-line{background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.6)}
.string-note{font-family:'Inter',sans-serif;font-size:10px;font-weight:400;color:var(--text3);transition:color .2s;text-align:center;letter-spacing:.3px}
.string-item.active .string-note{color:var(--accent)}
.string-item.active.in-tune .string-note{color:#4ade80;font-weight:600}
.string-dot{width:5px;height:5px;border-radius:50%;background:var(--border2);margin-top:6px;transition:background .2s}
.string-item.active .string-dot{background:var(--accent)}
.string-item.active.in-tune .string-dot{background:#4ade80;box-shadow:0 0 6px rgba(74,222,128,.7)}

/* TUNING */
.tuning-row{display:flex;align-items:center;justify-content:center;padding:0 20px 6px;flex-shrink:0}
.tuning-chip{padding:6px 18px;border-radius:20px;background:var(--surface2);border:1px solid var(--border2);color:var(--text2);font-size:11px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.tuning-chip:active{background:var(--border2)}

/* A4 */
.a4-row{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 20px 8px;flex-shrink:0}
.a4-btn{width:42px;height:42px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);color:var(--text2);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.a4-btn:active{background:var(--border2);transform:scale(.93)}
.a4-label{font-family:'Inter',sans-serif;font-size:15px;font-weight:500;color:var(--text);min-width:110px;text-align:center;letter-spacing:.5px}

/* MIC */
.mic-row{display:flex;align-items:center;gap:8px;padding:4px 20px calc(6px + var(--safe-bottom));flex-shrink:0}
.mic-track{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;position:relative}
.mic-bar{height:100%;width:0%;border-radius:3px;transition:width .08s, background-color .12s;
  background-color:#22d3ee}
.mic-lbl{color:var(--text3);font-size:9px;font-weight:700;letter-spacing:1px;width:24px}
.mic-db{font-family:'Inter',sans-serif;font-size:10px;color:var(--text3);width:44px;text-align:right}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal-box{width:100%;background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--border2);padding:20px 20px calc(24px + var(--safe-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:80dvh;overflow-y:auto}
.modal-bg.open .modal-box{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2);text-align:center;margin-bottom:14px}
.tuning-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Modal — yeni iki adımlı yapı */
.modal-cat-row{display:flex;gap:8px}
.cat-btn-big, .cat-btn{flex:1;padding:14px 0;border-radius:12px;font-size:14px;font-weight:600;letter-spacing:.3px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;font-family:'Inter',sans-serif}
.cat-btn-big{padding:16px 0;font-size:15px;font-weight:700}
.cat-btn-big:active, .cat-btn:active{transform:scale(.97);background:var(--border2)}
.cat-btn-big:hover, .cat-btn:hover{border-color:var(--accent)}

.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border2)}
.modal-back{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;border:none;background:transparent;color:var(--text2);cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:'Inter',sans-serif}
.modal-back:active{background:var(--surface2)}
.modal-header-title{font-size:14px;font-weight:700;color:var(--text);letter-spacing:.3px;text-align:center;flex:1}

.string-count-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.string-count-btn{padding:20px 12px;border-radius:14px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:18px;font-weight:700;font-family:'Inter',sans-serif;transition:all .15s;-webkit-tap-highlight-color:transparent}
.string-count-btn span{font-size:11px;font-weight:400;color:var(--text3);letter-spacing:.3px}
.string-count-btn:active{transform:scale(.97)}
.string-count-btn:hover{border-color:var(--accent);background:rgba(59,130,246,.06)}
.tuning-cat-btns{display:flex;gap:8px;margin-bottom:12px}
.tuning-cat-btn{flex:1;padding:8px 0;border-radius:10px;font-size:12px;font-weight:700;letter-spacing:.5px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.tuning-cat-btn.active{background:rgba(59,130,246,.1);border-color:var(--accent);color:var(--accent)}
.tuning-cat-btn:active{transform:scale(.97)}
.tuning-card{padding:12px 14px;border-radius:12px;border:1px solid var(--border2);background:var(--surface2);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.tuning-card:hover{border-color:var(--accent)}
.tuning-card.sel{border-color:var(--accent);background:rgba(59,130,246,.08)}
.tuning-card:active{transform:scale(.97)}
.tuning-card-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;letter-spacing:.2px}
.tuning-card.sel .tuning-card-name{color:var(--accent)}
.tuning-card-notes{font-family:'Inter',sans-serif;font-size:11px;color:var(--text3);letter-spacing:.3px}
</style>
</head>
<body>

<div class="app-header">
  <h1 class="logo"><span class="logo-highlight">Y</span><span class="logo-tuner">Tuner</span></h1>
  <button id="installBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    YÜKLE
  </button>
</div>

<div id="carouselContainer">
  <div id="themeCarousel">
    <!-- PREV PAGE -->
    <div id="page-prev" class="theme-page"></div>
    
    <!-- CURRENT PAGE -->
    <div id="page-curr" class="theme-page">
      <div class="note-card">
        <div class="note-display">
          <div class="note-letter">–</div>
          <div class="note-octave"></div>
        </div>
        <div class="note-info">
          <div class="note-freq">– Hz</div>
          <div class="target-note"></div>
          <div class="manual-badge">● MANUAL</div>
          <div class="in-tune-badge">✓ IN TUNE</div>
        </div>
      </div>

      <div class="micro-card">
        <div class="micro-left">
          <div class="micro-note">–</div>
          <div class="micro-perde">Perde bekleniyor</div>
        </div>
        <div class="micro-right">
          <div class="micro-koma">–<sub>koma</sub></div>
          <div class="micro-freq">– Hz</div>
          <div class="micro-dev">– ¢</div>
          <div class="micro-intune">✓ DOĞRU MIKROTONA</div>
        </div>
      </div>

      <div class="gauge-section">
        <button class="gauge-arrow gauge-arrow-left" onclick="changeGauge(-1)" aria-label="Önceki">‹</button>
        <div class="gauge-wrap">
          <canvas class="gauge-canvas"></canvas>
        </div>
        <button class="gauge-arrow gauge-arrow-right" onclick="changeGauge(1)" aria-label="Sonraki">›</button>
      </div>

      <div class="cent-row">
        <span class="cent-side">♭ FLAT</span>
        <span class="cent-val">– ¢</span>
        <span class="cent-side">SHARP ♯</span>
      </div>

      <!-- STRINGS -->
      <div class="strings-section" style="display:none;">
        <div class="strings-wrap">
          <div class="strings-list"></div>
        </div>
      </div>
      <div class="tuning-row">
        <button class="tuning-chip" onclick="openTuning()">▼ Chromatic</button>
      </div>

      <!-- A4 -->
      <div class="a4-row">
        <button class="a4-btn" onclick="changeA4(-1)">−</button>
        <span class="a4-label">A4 = 440 Hz</span>
        <button class="a4-btn" onclick="changeA4(1)">+</button>
      </div>

      <!-- MIC -->
      <div class="mic-row">
        <span class="mic-lbl">MIC</span>
        <div class="mic-track"><div class="mic-bar"></div></div>
        <span class="mic-db">– dB</span>
      </div>
    </div>

    <!-- NEXT PAGE -->
    <div id="page-next" class="theme-page"></div>
  </div>
</div>

<!-- TUNING MODAL -->
<div class="modal-bg" id="tuningModal" onclick="closeTuning(event)">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
// ===== VERİ =====
const TUNINGS = [
  // Gitar
  {cat:'gitar', name:'Standard',    notes:['E2','A2','D3','G3','B3','E4']},
  {cat:'gitar', name:'Drop D',      notes:['D2','A2','D3','G3','B3','E4']},
  {cat:'gitar', name:'Open G',      notes:['D2','G2','D3','G3','B3','D4']},
  {cat:'gitar', name:'Open D',      notes:['D2','A2','D3','F#3','A3','D4']},
  {cat:'gitar', name:'DADGAD',      notes:['D2','A2','D3','G3','A3','D4']},
  {cat:'gitar', name:'Half ♭',      notes:['Eb2','Ab2','Db3','Gb3','Bb3','Eb4']},
  {cat:'gitar', name:'Drop C',      notes:['C2','G2','C3','F3','A3','D4']},
  {cat:'gitar', name:'Open E',      notes:['E2','B2','E3','G#3','B3','E4']},

// ===== STATE =====
let a4 = 440;
let tuning = TUNINGS[0];
let mode = 'chromatic'; // standard | chromatic | microtonal
let pitchData = null;
let microData = null;
let closestStr = null;
let manualStr = null;
let needleCents = 0;
let audioCtx = null, analyser = null, timeBuf = null;

// ===== FREKANS ARAÇLARI =====
function noteToFreq(n) {
  const m = n.match(/^([A-G][#b]?)(\d)$/);
  if (!m) return 0;
  const sem = NM[m[1]], oct = parseInt(m[2]);
  if (sem === undefined) return 0;
  return a4 * Math.pow(2, ((oct+1)*12 + sem - 69) / 12);
}

function freqToData(freq, targetFreq) {
  if (!freq || freq < 20 || freq > 6000) return null;
  const n = 12 * Math.log2(freq / a4) + 69;
  const rounded = Math.round(n);
  const idx = ((rounded % 12) + 12) % 12;
  const oct = Math.floor(rounded / 12) - 1;
  const cents = targetFreq
    ? Math.round(1200 * Math.log2(freq / targetFreq))
    : Math.round((n - rounded) * 100);
  return { note: NN[idx], octave: oct, cents, frequency: freq, inTune: Math.abs(cents) <= 2 };
}

function findClosest(freq) {
  if (!freq) return null;
  let best = null, bd = Infinity;
  tuning.notes.forEach((n, i) => {
    const d = Math.abs(Math.log2(freq / noteToFreq(n)));
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}

function microtonalDetect(freq) {
  if (!freq || freq < 20 || freq > 6000) return null;
  const c4 = a4 * Math.pow(2, -9/12);
  const centsFromC4 = 1200 * Math.log2(freq / c4);
  const centsInOctave = ((centsFromC4 % 1200) + 1200) % 1200;
  const komaFloat = centsInOctave / KOMA_BIRIM;
  const komaSayisi = Math.round(komaFloat) % 53;
  const targetCents = komaSayisi * KOMA_BIRIM;
  const deviation = Math.round((centsInOctave - targetCents) * 10) / 10;

  // En yakın perdeyi bul (tam eşleşme varsa onu al)
  let bestPerde = PERDELER[0], bestDiff = Infinity;
  PERDELER.forEach(p => {
    const d = Math.min(Math.abs(p[0] - komaSayisi), Math.abs(p[0] + 53 - komaSayisi));
    if (d < bestDiff) { bestDiff = d; bestPerde = p; }
  });

  const octave = Math.floor((centsFromC4 + 600) / 1200) + 4;
  return {
    note: bestPerde[1] + octave,
    perdeAdı: bestPerde[2],
    komaKodu: bestPerde[3],  // B2 gibi kısa kod
    koma: komaSayisi,
    deviation,
    frequency: freq,
    inTune: Math.abs(deviation) <= 5,
  };
}

// ===== YIN =====
function yin(buf, sr) {
  const half = Math.floor(buf.length / 2);
  const diff = new Float32Array(half);
  for (let t = 1; t < half; t++) {
    let s = 0;
    for (let j = 0; j < half; j++) { const d = buf[j]-buf[j+t]; s += d*d; }
    diff[t] = s;
  }
  const cm = new Float32Array(half); cm[0] = 1;
  let rs = 0;
  for (let t = 1; t < half; t++) { rs += diff[t]; cm[t] = rs === 0 ? 0 : diff[t]*t/rs; }
  let tau = 2;
  while (tau < half) { if (cm[tau] < 0.15) { while (tau+1 < half && cm[tau+1] < cm[tau]) tau++; break; } tau++; }
  if (tau === half || cm[tau] >= 0.15) return -1;
  const x0 = tau>1?tau-1:tau, x2 = tau+1<half?tau+1:tau;
  let bt;
  if (x0===tau) bt = cm[tau]<=cm[x2]?tau:x2;
  else if (x2===tau) bt = cm[tau]<=cm[x0]?tau:x0;
  else { const s0=cm[x0],s1=cm[tau],s2=cm[x2]; bt = tau+(s2-s0)/(2*(2*s1-s2-s0)); }
  return sr / bt;
}

function rms(buf) {
  let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i]*buf[i]; return Math.sqrt(s/buf.length);
}

// ===== SES =====
const FREQ_BUF = [];
const FREQ_BUF_SIZE = 6;

function smoothFreq(freq) {
  FREQ_BUF.push(freq);
  if (FREQ_BUF.length > FREQ_BUF_SIZE) FREQ_BUF.shift();
  // Medyan al — aykırı değerleri eliyor
  const sorted = [...FREQ_BUF].sort((a,b) => a-b);
  return sorted[Math.floor(sorted.length / 2)];
}
async function startAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}
    });
    audioCtx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:44100});
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 4096;
    timeBuf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
    tick();
  } catch(e) { console.error(e); }
}

function tick() {
  requestAnimationFrame(tick);
  analyser.getFloatTimeDomainData(timeBuf);
  const level = rms(timeBuf);
  // dB hesapla: 0 dBFS referansı
  const db = level > 0.00001 ? Math.max(-60, 20 * Math.log10(level)) : -60;
  const pct = Math.max(0, ((db + 60) / 60) * 100); // -60dB=0%, 0dB=100%
  const micBar = document.getElementById('micBar');
  micBar.style.width = pct + '%';
  // Akışkan renk: cyan → yeşil → amber → kırmızı
  // pct: 0–35 cyan→yeşil, 35–65 yeşil→amber, 65–100 amber→kırmızı
  const lerp = (a, b, t) => a + (b - a) * t;
  const lerpColor = (c1, c2, t) => [
    Math.round(lerp(c1[0], c2[0], t)),
    Math.round(lerp(c1[1], c2[1], t)),
    Math.round(lerp(c1[2], c2[2], t)),
  ];
  const cyan = [34, 211, 238], green = [74, 222, 128], amber = [245, 158, 11], red = [239, 68, 68];
  let rgb;
  if (pct < 35) rgb = lerpColor(cyan, green, pct / 35);
  else if (pct < 65) rgb = lerpColor(green, amber, (pct - 35) / 30);
  else rgb = lerpColor(amber, red, Math.min(1, (pct - 65) / 35));

  const updateMic = (pid) => {
    const p = document.getElementById(pid);
    if (!p) return;
    const mb = p.querySelector('.mic-bar');
    if (mb) {
      mb.style.width = pct + '%';
      mb.style.backgroundColor = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
    }
    const md = p.querySelector('.mic-db');
    if (md) md.textContent = db > -60 ? db.toFixed(1)+' dB' : '–∞ dB';
  };

  updateMic('page-curr');
  if (isDragging || isTransitioning) {
    updateMic('page-prev');
    updateMic('page-next');
  }

  if (level < 0.008) {
    pitchData = null; microData = null; closestStr = manualStr;
    needleCents += (0 - needleCents) * 0.1;
    updateUI('page-curr'); drawAllVisible(); return;
  }

  const rawFreq = yin(timeBuf, audioCtx.sampleRate);
  const freq = rawFreq > 20 && rawFreq < 5000 ? smoothFreq(rawFreq) : -1;

  if (freq > 20 && freq < 5000) {
    if (mode === 'microtonal') {
      microData = microtonalDetect(freq);
      pitchData = null; closestStr = null;
      const dev = microData?.deviation ?? 0;
      needleCents += (Math.max(-50, Math.min(50, dev*4)) - needleCents) * 0.12;
    } else if (mode === 'chromatic') {
      pitchData = freqToData(freq, null);
      microData = null; closestStr = null;
      needleCents += ((pitchData?.cents ?? 0) - needleCents) * 0.12;
    } else {
      const autoStr = findClosest(freq);
      closestStr = manualStr !== null ? manualStr : autoStr;
      const tf = noteToFreq(tuning.notes[closestStr]);
      pitchData = freqToData(freq, tf);
      microData = null;
      needleCents += ((pitchData?.cents ?? 0) - needleCents) * 0.12;
    }
  } else {
    pitchData = null; microData = null;
    closestStr = mode === 'standard' && manualStr !== null ? manualStr : null;
    needleCents += (0 - needleCents) * 0.08;
  }

  updateUI('page-curr');
  if (isDragging || isTransitioning) {
    updateUI('page-prev');
    updateUI('page-next');
  }
  drawAllVisible();
}

// ===== UI =====
function updateUI(pageId = 'page-curr') {
  const page = document.getElementById(pageId);
  if (!page) return;

  if (mode === 'microtonal') {
    const md = microData;
    const card = page.querySelector('.micro-card');
    card.className = 'micro-card show' + (md?.inTune ? ' in-tune' : '');
    page.querySelector('.micro-note').textContent = md?.note ?? '–';
    page.querySelector('.micro-perde').textContent = md ? md.perdeAdı + ' (' + md.komaKodu + ')' : 'Perde bekleniyor';
    page.querySelector('.micro-koma').innerHTML = md ? md.koma+'<sub>koma</sub>' : '–<sub>koma</sub>';
    page.querySelector('.micro-freq').textContent = md ? md.frequency.toFixed(2)+' Hz' : '– Hz';
    const dev = md?.deviation ?? null;
    const devEl = page.querySelector('.micro-dev');
    devEl.textContent = dev !== null ? (dev >= 0 ? '+' : '')+dev+' ¢' : '– ¢';
    devEl.style.color = md?.inTune ? 'var(--accent)' : 'var(--text2)';

    // Cent göstergesi
    const centEl = page.querySelector('.cent-val');
    centEl.textContent = dev !== null ? (dev >= 0 ? '+' : '')+dev+' ¢' : '– ¢';
    centEl.className = 'cent-val' + (md?.inTune ? ' in-tune' : '');
    return;
  }

  // Standard / Chromatic
  const inTune = pitchData?.inTune ?? false;
  page.querySelector('.note-card').className = 'note-card' + (inTune ? ' in-tune' : '');
  page.querySelector('.note-letter').textContent = pitchData?.note ?? '–';
  page.querySelector('.note-octave').textContent = pitchData?.octave ?? '';
  page.querySelector('.note-freq').textContent = pitchData ? pitchData.frequency.toFixed(2)+' Hz' : '– Hz';

  const c = pitchData?.cents ?? null;
  const cv = page.querySelector('.cent-val');
  cv.textContent = c !== null ? (c >= 0 ? '+' : '')+c+' ¢' : '– ¢';
  cv.className = 'cent-val' + (inTune ? ' in-tune' : '');

  const tEl = page.querySelector('.target-note');
  if (mode === 'standard' && closestStr !== null) {
    const tn = tuning.notes[closestStr];
    tEl.innerHTML = 'Hedef: <span>'+tn+'</span> · '+noteToFreq(tn).toFixed(1)+' Hz';
  } else { tEl.innerHTML = ''; }

  const mb = page.querySelector('.manual-badge');
  if (mb) mb.className = 'manual-badge'+(manualStr!==null&&mode==='standard'?' show':'');

  // Bottom UI
  const tc = page.querySelector('.tuning-chip');
  if (tc) tc.textContent = '▼ ' + (mode === 'chromatic' ? 'Chromatic' : tuning.name);
  
  const a4l = page.querySelector('.a4-label');
  if (a4l) a4l.textContent = 'A4 = ' + a4 + ' Hz';

  const ss = page.querySelector('.strings-section');
  if (ss) ss.style.display = mode === 'standard' ? '' : 'none';

  if (mode === 'standard') {
    renderStrings(pageId);
  }
}

// ===== GAUGE — STİLLER =====
const GAUGES = [
  { id:'klasik',       name:'Klasik' },
  { id:'klasikBuyuk',  name:'Klasik Büyük' },
  { id:'komur',        name:'Kömür' },
  { id:'krem',         name:'Krem' },
  { id:'morNeon',      name:'Mor Neon' },
  { id:'orman',        name:'Orman' },
  { id:'minimal',      name:'Minimalist' },
  { id:'led',          name:'Dijital LED' },
];
let currentGauge = 0;

function getCanvasCtx(canvas) {
  if (!canvas) return null;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth, H = W * 0.58;
  if (W === 0) return null;
  if (canvas.width !== W*dpr) { canvas.width = W*dpr; canvas.height = H*dpr; }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  return { canvas, ctx, W, H };
}

function drawGauge(gaugeIdx, canvasEl) {
  if (!canvasEl) return;
  const style = GAUGES[gaugeIdx].id;
  const res = getCanvasCtx(canvasEl);
  if (!res) return;
  const { ctx, W, H } = res;

  if (style === 'klasik') drawKlasik(ctx, W, H);
  else if (style === 'klasikBuyuk') drawKlasikBuyuk(ctx, W, H);
  else if (style === 'komur') drawKlasikTema('komur', ctx, W, H);
  else if (style === 'krem') drawKlasikTema('krem', ctx, W, H);
  else if (style === 'morNeon') drawKlasikTema('morNeon', ctx, W, H);
  else if (style === 'orman') drawKlasikTema('orman', ctx, W, H);
  else if (style === 'minimal') drawMinimal(ctx, W, H);
  else if (style === 'led') drawLED(ctx, W, H);
}

// 1. KLASİK — yarım daire gauge (orijinal)
function drawKlasik(ctx, W, H) {
  const cx = W/2, cy = H-14, R = Math.min(W*.46,H*.9);

  ctx.beginPath(); ctx.arc(cx,cy,R,Math.PI,2*Math.PI);
  ctx.strokeStyle = '#1a2d4a'; ctx.lineWidth = 10; ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, R, Math.PI+(48/100)*Math.PI, Math.PI+(52/100)*Math.PI);
  ctx.strokeStyle = 'rgba(74,222,128,.5)'; ctx.lineWidth = 10; ctx.stroke();

  [-50,-45,-40,-35,-30,-25,-20,-15,-10,-5,0,5,10,15,20,25,30,35,40,45,50].forEach(c => {
    const ang = Math.PI + (c+50)/100*Math.PI;
    const isLabel = [-40,-20,0,20,40].includes(c);
    const isMajor = c % 10 === 0;
    const tl = isLabel ? 16 : isMajor ? 10 : 5;
    ctx.beginPath();
    ctx.moveTo(cx+(R+2)*Math.cos(ang), cy+(R+2)*Math.sin(ang));
    ctx.lineTo(cx+(R+2-tl)*Math.cos(ang), cy+(R+2-tl)*Math.sin(ang));
    ctx.strokeStyle = c === 0 ? '#4ade80' : '#2a4060';
    ctx.lineWidth = isLabel ? 2 : 1; ctx.stroke();
    if (isLabel) {
      ctx.fillStyle = '#3d5278';
      ctx.font = "500 11px 'Inter',sans-serif";
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText((c>0?'+':'')+c, cx+(R-32)*Math.cos(ang), cy+(R-32)*Math.sin(ang));
    }
  });

  const inTune = pitchData?.inTune || microData?.inTune || false;
  const clamp = Math.max(-50, Math.min(50, needleCents));
  const ang = Math.PI + (clamp+50)/100*Math.PI;
  ctx.beginPath(); ctx.moveTo(cx,cy);
  ctx.lineTo(cx+(R-22)*Math.cos(ang), cy+(R-22)*Math.sin(ang));
  ctx.strokeStyle = inTune ? '#4ade80' : 'rgba(226,232,240,.85)';
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.stroke();

  ctx.beginPath(); ctx.arc(cx,cy,8,0,2*Math.PI); ctx.fillStyle='#f59e0b'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,4,0,2*Math.PI); ctx.fillStyle='#1a2d4a'; ctx.fill();
}

// 1B. KLASİK BÜYÜK — okunaklı versiyon: kalın çizgiler, büyük rakamlar, yüksek kontrast
function drawKlasikBuyuk(ctx, W, H) {
  const cx = W/2, cy = H-14, R = Math.min(W*.46, H*.9);
  const inTune = pitchData?.inTune || microData?.inTune || false;

  // Yay — kalın
  ctx.beginPath(); ctx.arc(cx,cy,R,Math.PI,2*Math.PI);
  ctx.strokeStyle = '#243a5f'; ctx.lineWidth = 16; ctx.stroke();

  // Yeşil bölge — daha geniş ve belirgin
  ctx.beginPath();
  ctx.arc(cx, cy, R, Math.PI+(46/100)*Math.PI, Math.PI+(54/100)*Math.PI);
  ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 16; ctx.stroke();

  // Tik işaretleri — büyük etiketli
  [-50,-40,-30,-20,-10,0,10,20,30,40,50].forEach(c => {
    const ang = Math.PI + (c+50)/100*Math.PI;
    const isLabel = c % 20 === 0 || c === 0;
    const isMajor = c % 10 === 0;
    const tl = isLabel ? 22 : isMajor ? 14 : 8;
    ctx.beginPath();
    ctx.moveTo(cx+(R+4)*Math.cos(ang), cy+(R+4)*Math.sin(ang));
    ctx.lineTo(cx+(R+4-tl)*Math.cos(ang), cy+(R+4-tl)*Math.sin(ang));
    ctx.strokeStyle = c === 0 ? '#4ade80' : '#5b7299';
    ctx.lineWidth = isLabel ? 3 : 2; ctx.stroke();
    if (isLabel) {
      // Büyük rakamlar
      ctx.fillStyle = c === 0 ? '#4ade80' : '#cbd5e1';
      ctx.font = `${c===0?'800':'700'} 18px 'Inter',sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText((c>0?'+':'')+c, cx+(R-44)*Math.cos(ang), cy+(R-44)*Math.sin(ang));
    }
  });

  // İbre — kalın
  const clamp = Math.max(-50, Math.min(50, needleCents));
  const ang = Math.PI + (clamp+50)/100*Math.PI;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx+(R-30)*Math.cos(ang), cy+(R-30)*Math.sin(ang));
  ctx.strokeStyle = inTune ? '#4ade80' : '#ffffff';
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.shadowColor = inTune ? '#4ade80' : 'rgba(255,255,255,.4)';
  ctx.shadowBlur = inTune ? 14 : 6;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Pivot — büyük
  ctx.beginPath(); ctx.arc(cx,cy,16,0,2*Math.PI);
  ctx.fillStyle='#f59e0b'; ctx.fill();
  ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,8,0,2*Math.PI);
  ctx.fillStyle='#0a1628'; ctx.fill();

  // FLAT/SHARP etiketleri — büyük
  ctx.fillStyle = '#7d93b2';
  ctx.font = "800 14px 'Inter',sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('FLAT ♭', cx + (R+18)*Math.cos(Math.PI), cy + (R+18)*Math.sin(Math.PI) - 4);
  ctx.fillText('♯ SHARP', cx + (R+18)*Math.cos(2*Math.PI), cy + (R+18)*Math.sin(2*Math.PI) - 4);
}

// KLASİK + TEMA — orijinal yarım daire, farklı renk paletlerinde
function drawKlasikTema(temaId, ctx, W, H) {
  const themes = {
    komur: {
      bg: null, // canvas zemini saf siyah; body zemini değişmez ama canvas dolduralım
      arc: '#2a2a2a',
      green: '#facc15', // sarı
      greenZone: 'rgba(250,204,21,.55)',
      tickMinor: '#3a3a3a',
      tickLabel: '#9ca3af',
      needle: '#facc15',
      needleNeutral: '#f5f5f5',
      pivot: '#fb923c',
      pivotInner: '#000000',
    },
    krem: {
      bg: '#f5e9d3',
      arc: '#a8927a',
      green: '#15803d',
      greenZone: 'rgba(21,128,61,.4)',
      tickMinor: '#7a6a55',
      tickLabel: '#5c4a32',
      needle: '#15803d',
      needleNeutral: '#3a2a1a',
      pivot: '#a04b2a',
      pivotInner: '#5c3010',
    },
    morNeon: {
      bg: '#1a0c2e',
      arc: '#3a1c5a',
      green: '#f0abfc', // neon pembe
      greenZone: 'rgba(240,171,252,.5)',
      tickMinor: '#4a2c6a',
      tickLabel: '#c084fc',
      needle: '#f0abfc',
      needleNeutral: '#e9d5ff',
      pivot: '#c026d3',
      pivotInner: '#1a0c2e',
    },
    orman: {
      bg: '#0d1f15',
      arc: '#1e3a2a',
      green: '#fbbf24', // altın
      greenZone: 'rgba(251,191,36,.5)',
      tickMinor: '#2a4a35',
      tickLabel: '#86efac',
      needle: '#fbbf24',
      needleNeutral: '#dcfce7',
      pivot: '#a16207',
      pivotInner: '#0d1f15',
    },
  };
  const tema = themes[temaId];
  const cx = W/2, cy = H-14, R = Math.min(W*.46, H*.9);

  // Tema arka planı
  if (tema.bg) {
    ctx.fillStyle = tema.bg;
    ctx.fillRect(0, 0, W, H);
  }

  const cx = W/2, cy = H-14, R = Math.min(W*.46, H*.9);
  const inTune = pitchData?.inTune || microData?.inTune || false;

  // Yay
  ctx.beginPath(); ctx.arc(cx,cy,R,Math.PI,2*Math.PI);
  ctx.strokeStyle = tema.arc; ctx.lineWidth = 10; ctx.stroke();

  // In-tune bölgesi
  ctx.beginPath();
  ctx.arc(cx, cy, R, Math.PI+(48/100)*Math.PI, Math.PI+(52/100)*Math.PI);
  ctx.strokeStyle = tema.greenZone; ctx.lineWidth = 10; ctx.stroke();

  // Tik işaretleri
  [-50,-45,-40,-35,-30,-25,-20,-15,-10,-5,0,5,10,15,20,25,30,35,40,45,50].forEach(c => {
    const ang = Math.PI + (c+50)/100*Math.PI;
    const isLabel = [-40,-20,0,20,40].includes(c);
    const isMajor = c % 10 === 0;
    const tl = isLabel ? 16 : isMajor ? 10 : 5;
    ctx.beginPath();
    ctx.moveTo(cx+(R+2)*Math.cos(ang), cy+(R+2)*Math.sin(ang));
    ctx.lineTo(cx+(R+2-tl)*Math.cos(ang), cy+(R+2-tl)*Math.sin(ang));
    ctx.strokeStyle = c === 0 ? tema.green : tema.tickMinor;
    ctx.lineWidth = isLabel ? 2 : 1; ctx.stroke();
    if (isLabel) {
      ctx.fillStyle = tema.tickLabel;
      ctx.font = "500 11px 'Inter',sans-serif";
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText((c>0?'+':'')+c, cx+(R-32)*Math.cos(ang), cy+(R-32)*Math.sin(ang));
    }
  });

  // İbre
  const clamp = Math.max(-50, Math.min(50, needleCents));
  const ang = Math.PI + (clamp+50)/100*Math.PI;
  ctx.beginPath(); ctx.moveTo(cx,cy);
  ctx.lineTo(cx+(R-22)*Math.cos(ang), cy+(R-22)*Math.sin(ang));
  ctx.strokeStyle = inTune ? tema.green : tema.needleNeutral;
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.stroke();

  // Pivot
  ctx.beginPath(); ctx.arc(cx,cy,8,0,2*Math.PI);
  ctx.fillStyle = tema.pivot; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,4,0,2*Math.PI);
  ctx.fillStyle = tema.pivotInner; ctx.fill();
}

// 2. MİNİMALİST — yatay ince çizgi, kayan ibre
function drawMinimal(ctx, W, H) {
  const cy = H/2;
  const padX = 30;
  const lineW = W - padX*2;
  const cx = W/2;

  // Ana çizgi
  ctx.beginPath();
  ctx.moveTo(padX, cy); ctx.lineTo(W-padX, cy);
  ctx.strokeStyle = '#1e2e4a'; ctx.lineWidth = 1; ctx.stroke();

  // Merkez işareti (yeşil dikey çizgi)
  ctx.beginPath();
  ctx.moveTo(cx, cy-22); ctx.lineTo(cx, cy+22);
  ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 1; ctx.stroke();

  // Hafif tik işaretleri
  [-40,-20,20,40].forEach(c => {
    const x = cx + (c/50) * (lineW/2);
    ctx.beginPath();
    ctx.moveTo(x, cy-4); ctx.lineTo(x, cy+4);
    ctx.strokeStyle = '#253551'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#3d5278';
    ctx.font = "400 10px 'Inter',sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText((c>0?'+':'')+c, x, cy+22);
  });

  // İbre — küçük yuvarlak nokta
  const inTune = pitchData?.inTune || microData?.inTune || false;
  const clamp = Math.max(-50, Math.min(50, needleCents));
  const x = cx + (clamp/50) * (lineW/2);

  // İz çizgisi
  ctx.beginPath();
  ctx.moveTo(cx, cy); ctx.lineTo(x, cy);
  ctx.strokeStyle = inTune ? 'rgba(74,222,128,.4)' : 'rgba(59,130,246,.3)';
  ctx.lineWidth = 2; ctx.stroke();

  // Halka
  ctx.beginPath(); ctx.arc(x, cy, 9, 0, 2*Math.PI);
  ctx.fillStyle = inTune ? '#4ade80' : '#3b82f6';
  ctx.fill();
  ctx.beginPath(); ctx.arc(x, cy, 4, 0, 2*Math.PI);
  ctx.fillStyle = '#0a1628'; ctx.fill();
}

// 3. DİJİTAL LED — strob şerit, soldan-sağa LED'ler
function drawLED(ctx, W, H) {
  const cy = H/2;
  const padX = 24;
  const ledCount = 21; // -50..+50, her 5 cent
  const ledW = (W - padX*2) / ledCount;
  const ledH = 36;
  const ledY = cy - ledH/2;
  const inTune = pitchData?.inTune || microData?.inTune || false;
  const clamp = Math.max(-50, Math.min(50, needleCents));
  const center = (ledCount - 1) / 2;
  const activeIdx = (clamp / 50) * center + center;

  for (let i = 0; i < ledCount; i++) {
    const x = padX + i*ledW;
    const distFromCenter = Math.abs(i - center);
    const distFromActive = Math.abs(i - activeIdx);
    const isCenter = i === Math.round(center);

    // Off renk
    let fill = '#1a2d4a';
    let glow = 0;

    if (distFromActive < 1.2) {
      // Aktif LED — pitch'e göre
      if (inTune || distFromCenter <= 0.8) {
        fill = '#4ade80'; glow = 14;
      } else if (distFromCenter < 4) {
        fill = '#f59e0b'; glow = 12;
      } else {
        fill = '#ef4444'; glow = 12;
      }
    } else if (isCenter) {
      // Merkez işareti — hafif yeşil
      fill = 'rgba(74,222,128,.18)';
    }

    if (glow > 0) {
      ctx.shadowBlur = glow; ctx.shadowColor = fill;
    } else {
      ctx.shadowBlur = 0;
    }

    ctx.fillStyle = fill;
    ctx.fillRect(x+1, ledY, ledW-2, ledH);
    ctx.shadowBlur = 0;
  }

  // Alt etiketler
  ctx.fillStyle = '#3d5278';
  ctx.font = "500 10px 'Inter',sans-serif";
  ctx.textAlign = 'center';
  [-50, 0, 50].forEach(c => {
    const i = (c / 50) * center + center;
    const x = padX + i*ledW + ledW/2;
    ctx.fillText((c>0?'+':'')+c, x, cy + ledH/2 + 16);
  });
}

// ===== CAROUSEL LOGIC & SWIPE =====
let isDragging = false;
let startX = 0;
let currentPos = 0;
let animationID = 0;

function initCarousel() {
  const currContent = document.getElementById('page-curr').innerHTML;
  document.getElementById('page-prev').innerHTML = currContent;
  document.getElementById('page-next').innerHTML = currContent;
  updateCarouselBuffer();
}

function updateCarouselBuffer() {
  const n = GAUGES.length;
  const prevIdx = (currentGauge - 1 + n) % n;
  const nextIdx = (currentGauge + 1 + n) % n;

  setPageTheme('page-prev', prevIdx);
  setPageTheme('page-curr', currentGauge);
  setPageTheme('page-next', nextIdx);
}

function setPageTheme(id, gaugeIdx) {
  const page = document.getElementById(id);
  const style = GAUGES[gaugeIdx].id;
  page.className = 'theme-page ' + 'theme-' + style;
  updateUI(id);
}

function drawAllVisible() {
  const n = GAUGES.length;
  drawGauge((currentGauge - 1 + n) % n, document.querySelector('#page-prev .gauge-canvas'));
  drawGauge(currentGauge, document.querySelector('#page-curr .gauge-canvas'));
  drawGauge((currentGauge + 1 + n) % n, document.querySelector('#page-next .gauge-canvas'));
}

function changeGauge(dir) {
  if (isTransitioning) return;
  moveCarousel(dir);
}

function moveCarousel(dir) {
  const carousel = document.getElementById('themeCarousel');
  isTransitioning = true;
  carousel.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)';
  const targetX = dir > 0 ? -66.666 : 0;
  carousel.style.transform = `translateX(${targetX}%)`;
  
  setTimeout(() => {
    const n = GAUGES.length;
    currentGauge = (currentGauge + dir + n) % n;
    carousel.style.transition = 'none';
    carousel.style.transform = 'translateX(-33.333%)';
    updateCarouselBuffer();
    renderGaugeDots();
    isTransitioning = false;
  }, 400);
}

function renderGaugeDots() {
  document.getElementById('gaugeDots').innerHTML = GAUGES.map((g, i) =>
    `<button class="gauge-dot${i===currentGauge?' active':''}" onclick="goToGauge(${i})" aria-label="${g.name}"></button>`
  ).join('');
}

function goToGauge(i) {
  if (isTransitioning || i === currentGauge) return;
  changeGauge(i > currentGauge ? 1 : -1);
}

// Interactive Swipe
(() => {
  const carousel = document.getElementById('themeCarousel');
  let startPos = 0;
  
  window.addEventListener('touchstart', touchStart, {passive:true});
  window.addEventListener('touchend', touchEnd);
  window.addEventListener('touchmove', touchMove, {passive:false});

  function touchStart(e) {
    if (isTransitioning) return;
    if (e.target.closest('button, .tuning-card, .modal-box, input, .gauge-arrow')) return;
    
    isDragging = true;
    startPos = e.touches[0].clientX;
    currentPos = startPos;
    carousel.style.transition = 'none';
    animationID = requestAnimationFrame(animation);
  }

  function touchMove(e) {
    if (!isDragging) return;
    currentPos = e.touches[0].clientX;
    const diff = currentPos - startPos;
    if (Math.abs(diff) > 10 && e.cancelable) e.preventDefault();
  }

  function touchEnd() {
    if (!isDragging) return;
    isDragging = false;
    cancelAnimationFrame(animationID);

    const diff = currentPos - startPos;
    const threshold = window.innerWidth / 4;

    if (diff < -threshold) moveCarousel(1);
    else if (diff > threshold) moveCarousel(-1);
    else {
      isTransitioning = true;
      carousel.style.transition = 'transform 0.3s ease-out';
      carousel.style.transform = 'translateX(-33.333%)';
      setTimeout(() => { isTransitioning = false; }, 300);
    }
    startPos = 0;
    currentPos = 0;
  }

  function animation() {
    if (isDragging) {
      const diff = currentPos - startPos;
      const percentage = (diff / window.innerWidth) * 33.333;
      carousel.style.transform = `translateX(${ -33.333 + percentage }%)`;
      requestAnimationFrame(animation);
    }
  }
})();

// ===== TELLER =====
function renderStrings(pageId = 'page-curr') {
  const p = document.getElementById(pageId);
  if (!p) return;
  const list = p.querySelector('.strings-list');
  if (!list) return;

  list.innerHTML = tuning.notes.map((n,i) => {
    const isActive = i === closestStr && mode === 'standard';
    const isInTune = isActive && pitchData?.inTune;
    return `
      <div class="string-item ${isActive?'active':''} ${isInTune?'in-tune':''}" onclick="selectString(${i})">
        <div class="string-line"></div>
        <div class="string-note">${n}</div>
        <div class="string-dot"></div>
      </div>`;
  }).join('');
}
function selectString(i) {
  manualStr = manualStr === i ? null : i;
  if (manualStr !== null) closestStr = i;
  updateUI('page-curr');
}

// ===== A4 =====
function changeA4(dir) {
  const idx = A4_OPTS.indexOf(a4);
  a4 = A4_OPTS[Math.max(0, Math.min(A4_OPTS.length-1, idx+dir))];

// ===== TUNING MODAL — İKİ ADIMLI =====
let modalView = 'root'; // root | bass | gitar | uke

function openTuning() {
  modalView = 'root';
  renderModal();
  document.getElementById('tuningModal').classList.add('open');
}

function closeTuning(e) {
  if (e.target === document.getElementById('tuningModal'))
    document.getElementById('tuningModal').classList.remove('open');
}

function backToRoot() {
  modalView = 'root';
  renderModal();
}

function renderModal() {
  const el = document.getElementById('modalContent');
  if (modalView === 'root') {
    el.innerHTML = `
      <div class="modal-cat-row" style="margin-bottom:10px;">
        <button class="cat-btn-big" onclick="selectChromatic()">Chromatic</button>
      </div>
      <div class="modal-cat-row">
        <button class="cat-btn" onclick="goCat('bass')">Bass</button>
        <button class="cat-btn" onclick="goCat('gitar')">Guitar</button>
        <button class="cat-btn" onclick="goCat('uke')">Ukulele</button>
      </div>`;
    return;
  }

  // Alt görünümler
  const titles = { bass:'Bass', gitar:'Guitar', uke:'Ukulele' };
  let body = '';

  if (modalView === 'bass') {
    const stringCounts = [4,5,6,7];
    const buttons = stringCounts.map(n => {
      const items = TUNINGS.filter(t => t.name.startsWith('Bass '+n));
      if (!items.length) return '';
      return `<button class="string-count-btn" onclick="showTunings('bass',${n})">${n} Telli<span>${items.length} akort</span></button>`;
    }).join('');
    body = `<div class="string-count-grid">${buttons}</div>`;
  } else if (modalView === 'gitar') {
    const stringCounts = [6,7];
    const buttons = stringCounts.map(n => {
      const items = n === 6
        ? TUNINGS.filter(t => t.cat==='gitar' && !t.name.startsWith('Guitar 7'))
        : TUNINGS.filter(t => t.name.startsWith('Guitar 7'));
      if (!items.length) return '';
      return `<button class="string-count-btn" onclick="showTunings('gitar',${n})">${n} Telli<span>${items.length} akort</span></button>`;
    }).join('');
    body = `<div class="string-count-grid">${buttons}</div>`;
  } else if (modalView === 'uke') {
    // Ukulele tek tel sayısı — direkt akortları göster
    body = renderTuningCards(TUNINGS.filter(t => t.cat === 'uke'));
  } else if (modalView.startsWith('list-')) {
    const [, cat, n] = modalView.split('-');
    const num = parseInt(n);
    let items;
    if (cat === 'bass') {
      items = TUNINGS.filter(t => t.name.startsWith('Bass '+num));
    } else if (cat === 'gitar') {
      items = num === 6
        ? TUNINGS.filter(t => t.cat==='gitar' && !t.name.startsWith('Guitar 7'))
        : TUNINGS.filter(t => t.name.startsWith('Guitar 7'));
    }
    body = renderTuningCards(items);
  }

  // Geri butonlu başlık
  let titleText;
  if (modalView === 'bass' || modalView === 'gitar' || modalView === 'uke') {
    titleText = titles[modalView];
  } else if (modalView.startsWith('list-')) {
    const [, cat, n] = modalView.split('-');
    titleText = titles[cat] + ' · ' + n + ' Telli';
  }

  const backTarget = modalView.startsWith('list-')
    ? `goCat('${modalView.split('-')[1]}')`
    : 'backToRoot()';

  el.innerHTML = `
    <div class="modal-header">
      <button class="modal-back" onclick="${backTarget}">← Geri</button>
      <div class="modal-header-title">${titleText}</div>
      <div style="width:60px;"></div>
    </div>
    ${body}`;
}

function goCat(cat) {
  modalView = cat;
  renderModal();
}

function showTunings(cat, n) {
  modalView = 'list-' + cat + '-' + n;
  renderModal();
}

function renderTuningCards(items) {
  if (!items.length) return '<div style="text-align:center;color:var(--text3);padding:20px;">Akort bulunamadı</div>';
  return `<div class="tuning-grid">` + items.map(t => {
    const i = TUNINGS.indexOf(t);
    // İsmi temizle: "Bass 4 - Standard" → "Standard"
    const cleanName = t.name
      .replace(/^Bass \d+ - /, '')
      .replace(/^Guitar 7 - /, '');
    return `<div class="tuning-card ${t.name===tuning.name?'sel':''}" onclick="selectTuning(${i})">
      <div class="tuning-card-name">${cleanName}</div>
      <div class="tuning-card-notes">${t.notes.join(' · ')}</div>
    </div>`;
  }).join('') + `</div>`;
}

function selectChromatic() {
  mode = 'chromatic';
  manualStr = null;
  closestStr = null;
  pitchData = null; microData = null;
  document.getElementById('stringsSection').style.display = 'none';
  document.getElementById('tuningChip').textContent = '▼ Chromatic';
  document.getElementById('tuningModal').classList.remove('open');
  updateCarouselBuffer();
}

function selectTuning(i) {
  tuning = TUNINGS[i]; manualStr = null;
  document.getElementById('tuningChip').textContent = '▼ '+tuning.name;
  document.getElementById('tuningModal').classList.remove('open');
  if (mode !== 'standard') {
    mode = 'standard';
    document.getElementById('stringsSection').style.display = '';
    pitchData = null; microData = null;
  }
  renderStrings();
  updateCarouselBuffer();
}

initCarousel();
startAudio();

  drawAllVisible();
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') changeGauge(-1);

});

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registered'))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

    // Install Button Logic
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'flex';
    });
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          deferredPrompt = null;
          installBtn.style.display = 'none';
        }
      }
    });
    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      installBtn.style.display = 'none';
      console.log('App installed');
    });
    </script>
